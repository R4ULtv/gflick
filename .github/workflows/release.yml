name: Release bundles

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            arch: x86_64
            artifact: release-windows-x86_64
          - os: macos-15
            target: macos
            arch: aarch64
            artifact: release-macos-aarch64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Assert Apple Silicon runner
        if: runner.os == 'macOS'
        shell: bash
        run: test "$(uname -m)" = arm64
      - name: Verify tag matches all application package versions (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".Substring(1)
          $names = @(
            "gflick-agent", "gflick-tray", "gflick-cli",
            "gflick-setup", "gflick-probe", "gflick-bench"
          )
          $metadata = cargo metadata --format-version 1 --no-deps | ConvertFrom-Json
          $packages = @($metadata.packages | Where-Object { $names -contains $_.name })
          if ($packages.Count -ne $names.Count) { throw "Expected all six application packages" }
          foreach ($package in $packages) {
            if ($package.version -ne $version) {
              throw "Tag version $version does not match $($package.name) $($package.version)"
            }
          }
      - name: Verify tag matches all application package versions (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          names=(gflick-agent gflick-tray gflick-cli gflick-setup gflick-probe gflick-bench)
          metadata=$(cargo metadata --format-version 1 --no-deps)
          for name in "${names[@]}"; do
            package_version=$(jq -er --arg name "$name" '.packages[] | select(.name == $name) | .version' <<<"$metadata")
            test "$package_version" = "$version" || {
              echo "tag version $version does not match $name $package_version" >&2
              exit 1
            }
          done
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build release binaries
        run: cargo build --release --locked -p gflick-agent -p gflick-tray -p gflick-cli -p gflick-setup -p gflick-probe -p gflick-bench
      - name: Package Windows bundles
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".Substring(1)
          ./scripts/package-release.ps1 `
            -Version $version `
            -Target windows `
            -Architecture x86_64 `
            -BinaryDir target/release `
            -OutputDir dist
      - name: Package macOS bundles
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ./scripts/package-release.sh \
            --version "${GITHUB_REF_NAME#v}" \
            --target macos \
            --arch aarch64 \
            --binary-dir target/release \
            --output-dir dist
      - name: Upload Windows release artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/gflick-*-windows-x86_64.zip
            dist/SHA256SUMS-windows-x86_64
          if-no-files-found: error
          retention-days: 3
      - name: Upload macOS release artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/gflick-*-macos-aarch64.tar.gz
            dist/SHA256SUMS-macos-aarch64
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify and merge checksums
        shell: bash
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          cd dist
          archives=(
            "gflick-$version-windows-x86_64.zip"
            "gflick-$version-macos-aarch64.tar.gz"
            "gflick-devtools-$version-windows-x86_64.zip"
            "gflick-devtools-$version-macos-aarch64.tar.gz"
          )
          test "$(find . -maxdepth 1 -type f | wc -l | tr -d ' ')" = 6
          cat SHA256SUMS-windows-x86_64 SHA256SUMS-macos-aarch64 | LC_ALL=C sort -k2 > declared
          sha256sum "${archives[@]}" | LC_ALL=C sort -k2 > computed
          diff -u declared computed
          mv computed SHA256SUMS
          rm declared SHA256SUMS-windows-x86_64 SHA256SUMS-macos-aarch64
          test "$(find . -maxdepth 1 -type f | wc -l | tr -d ' ')" = 5
      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already exists" >&2
            exit 1
          fi
      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          gh release create "$GITHUB_REF_NAME" \
            "dist/gflick-$version-windows-x86_64.zip" \
            "dist/gflick-$version-macos-aarch64.tar.gz" \
            "dist/gflick-devtools-$version-windows-x86_64.zip" \
            "dist/gflick-devtools-$version-macos-aarch64.tar.gz" \
            "dist/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --generate-notes \
            --title "GFlick $GITHUB_REF_NAME"
