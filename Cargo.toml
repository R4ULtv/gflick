[workspace]
members = [
    "apps/agent",
    "apps/bench",
    "apps/cli",
    "apps/probe",
    "apps/settings",
    "apps/setup",
    "apps/tray",
    "crates/gflick-client",
    "crates/gflick-core",
    "crates/gflick-install",
    "crates/gflick-protocol",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[workspace.dependencies]
anyhow = "1.0.98"
clap = { version = "4.5.42", features = ["derive"] }
clap_complete = "4.5.61"
ctrlc = "3.5.2"
directories = "6.0.0"
hidapi = { version = "2.6.6", default-features = false }
image = { version = "=0.25.8", default-features = false, features = ["ico"] }
interprocess = "2.4.3"
gflick-core = { path = "crates/gflick-core" }
gflick-client = { path = "crates/gflick-client" }
gflick-install = { path = "crates/gflick-install" }
gflick-protocol = { path = "crates/gflick-protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
sysinfo = { version = "0.36.1", default-features = false, features = ["system"] }
tempfile = "3.20.0"
tray-icon = { version = "0.24.2", default-features = false }
winit = { version = "0.30.12", default-features = false, features = ["rwh_06"] }
winresource = "0.1"

# Prefiltering the device photos runs ~30x slower unoptimized, and the settings
# build script does it with `image`, whose resize is generic and so lands in the
# caller. build-override covers a build script and its dependencies together.
[profile.dev.build-override]
opt-level = 3

# The window runs through those same dependencies unoptimized: gpui's layout,
# text shaping and image decode are generic code that is only fast once inlined,
# which is why a debug build drops frames a release build never notices.
# Optimizing the dependencies while leaving this workspace at opt-level 0 keeps
# rebuilds quick and the window smooth.
[profile.dev.package."*"]
opt-level = 3
