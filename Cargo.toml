[workspace]
members = [
    "apps/agent",
    "apps/bench",
    "apps/probe",
    "crates/open-hub-core",
    "crates/open-hub-protocol",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[workspace.dependencies]
anyhow = "1.0.98"
clap = { version = "4.5.42", features = ["derive"] }
ctrlc = "3.5.2"
directories = "6.0.0"
hidapi = { version = "2.6.6", default-features = false }
interprocess = "2.4.3"
open-hub-core = { path = "crates/open-hub-core" }
open-hub-protocol = { path = "crates/open-hub-protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = { version = "0.36.1", default-features = false, features = ["system"] }
tempfile = "3.20.0"
