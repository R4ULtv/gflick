[workspace]
members = [
    "apps/agent",
    "apps/bench",
    "apps/cli",
    "apps/probe",
    "apps/setup",
    "apps/tray",
    "crates/open-hub-client",
    "crates/open-hub-core",
    "crates/open-hub-install",
    "crates/open-hub-protocol",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[workspace.dependencies]
anyhow = "1.0.98"
clap = { version = "4.5.42", features = ["derive"] }
clap_complete = "4.5.61"
ctrlc = "3.5.2"
directories = "6.0.0"
hidapi = { version = "2.6.6", default-features = false }
image = { version = "=0.25.8", default-features = false, features = ["ico"] }
interprocess = "2.4.3"
open-hub-core = { path = "crates/open-hub-core" }
open-hub-client = { path = "crates/open-hub-client" }
open-hub-install = { path = "crates/open-hub-install" }
open-hub-protocol = { path = "crates/open-hub-protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
sysinfo = { version = "0.36.1", default-features = false, features = ["system"] }
tempfile = "3.20.0"
tray-icon = { version = "0.24.2", default-features = false }
winit = { version = "0.30.12", default-features = false, features = ["rwh_06"] }
winresource = "0.1"
