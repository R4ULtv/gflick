[workspace]
members = ["crates/open-hub-core"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[workspace.dependencies]
anyhow = "1.0.98"
hidapi = { version = "2.6.6", default-features = false }
